apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: assign-role-to-user
spec:
  params:
    - name: project-name
      type: string
    - name: assignment-type
      type: string
    - name: user-or-group-name
      type: string
    - name: user-or-group-names-json
      type: string
    - name: set-quota
      type: string
    - name: cpu-request
      type: string
    - name: memory-request
      type: string
    - name: storage-request
      type: string
    - name: role-name
      type: string
    - name: project-label
      type: string
  results:
    - description: 'Pipeline''ı başlatan kullanıcı adı. step-5 tarafından yazılır, step-7 tarafından okunur.'
      name: pipeline-runner
      type: string
  stepTemplate:
    computeResources: {}
    env:
      - name: HOME
        value: /tmp
      - name: KUBECONFIG
        value: /tmp/kubeconfig
      - name: project-label
        value: sektor=kygmy
  steps:
    - args:
        - '-c'
        - |

          echo "============================================"
          echo " ADIM 1: Proje Adı Prefix Kontrolü"
          echo "============================================"

          PROJECT_NAME="$(params.project-name)"

          echo "Kontrol edilen proje adı: '${PROJECT_NAME}'"

          # Boşluk kontrolü
          if [[ -z "${PROJECT_NAME}" ]]; then
            echo "[HATA] Proje adı boş olamaz."
            exit 1
          fi

          # Küçük harf, rakam ve tire dışında karakter var mı?
          if [[ ! "${PROJECT_NAME}" =~ ^[a-z0-9][a-z0-9\-]*[a-z0-9]$ ]] && [[ ${#PROJECT_NAME} -gt 1 ]]; then
            echo "[HATA] Proje adı sadece küçük harf, rakam ve tire içerebilir. Baş/son karakter tire olamaz."
            exit 1
          fi

          # "prod-" prefix kontrolü
          if [[ "${PROJECT_NAME}" != prod-* ]]; then
            echo "[HATA] Proje adı 'prod-' prefix'i ile başlamalıdır."
            echo "       Girilen değer: '${PROJECT_NAME}'"
            echo "       Örnek geçerli isim: 'prod-myapp'"
            exit 1
          fi

          # Sadece "prod-" verilmiş mi? (suffix zorunlu)
          SUFFIX="${PROJECT_NAME#prod-}"
          if [[ -z "${SUFFIX}" ]]; then
            echo "[HATA] 'prod-' tek başına geçerli bir proje adı değildir."
            echo "       Lütfen prefix'ten sonra anlamlı bir isim ekleyin."
            echo "       Örnek: 'prod-myapp', 'prod-backend-api'"
            exit 1
          fi

          # Suffix en az 2 karakter olsun
          if [[ ${#SUFFIX} -lt 2 ]]; then
            echo "[HATA] 'prod-' sonrasındaki isim en az 2 karakter olmalıdır."
            exit 1
          fi

          # 63 karakter sınırı (Kubernetes namespace limiti)
          if [[ ${#PROJECT_NAME} -gt 63 ]]; then
            echo "[HATA] Proje adı 63 karakteri geçemez."
            echo "       Girilen uzunluk : ${#PROJECT_NAME} karakter"
            echo "       Maksimum        : 63 karakter"
            exit 1
          fi

          # Ardışık tire kontrolü (prod--myapp gibi geçersiz)
          if [[ "${PROJECT_NAME}" == *--* ]]; then
            echo "[HATA] Proje adında ardışık tire ('--') kullanılamaz."
            echo "       Girilen değer: '${PROJECT_NAME}'"
            exit 1
          fi

          echo "[OK] Prefix kontrolü başarılı. Proje adı: '${PROJECT_NAME}' (${#PROJECT_NAME} karakter)"
      command:
        - /bin/bash
      computeResources: {}
      image: 'registry.redhat.io/openshift4/ose-cli:latest'
      imagePullPolicy: IfNotPresent
      name: step-1-check-project-name
    - computeResources: {}
      image: 'registry.redhat.io/openshift4/ose-cli:latest'
      imagePullPolicy: IfNotPresent
      name: step-2-check-project-exists
      script: |
        #!/bin/bash
        set -e

        echo "============================================"
        echo " ADIM 2: Proje Varlık Kontrolü"
        echo "============================================"

        PROJECT_NAME="$(params.project-name)"
        echo "Kontrol edilen proje: '${PROJECT_NAME}'"


        if oc get project "${PROJECT_NAME}" &>/dev/null; then
          echo "[HATA] '${PROJECT_NAME}' adında bir proje zaten mevcut."
          echo "       Lütfen farklı bir proje adı seçin."
          exit 1
        fi
        echo "[OK] '${PROJECT_NAME}' ismi kullanılabilir. Oluşturma adımına geçiliyor."
    - computeResources: {}
      image: 'registry.redhat.io/openshift4/ose-cli:latest'
      imagePullPolicy: IfNotPresent
      name: step-3-create-project
      script: |
        #!/bin/bash
        set -e

        echo "============================================"
        echo " ADIM 3: Proje Oluşturma"
        echo "============================================"

        PROJECT_NAME="$(params.project-name)"
        DISPLAY_NAME="$(params.project-name)"
        DESCRIPTION="$(params.project-name)"

        # Opsiyonel parametrelerle komut oluştur
        CMD="oc new-project ${PROJECT_NAME}"
        if [[ -n "${DISPLAY_NAME}" ]]; then
          CMD="${CMD} --display-name='${DISPLAY_NAME}'"
        fi
        if [[ -n "${DESCRIPTION}" ]]; then
          CMD="${CMD} --description='${DESCRIPTION}'"
        fi

        echo "Çalıştırılan komut: ${CMD}"
        eval "${CMD}"

        echo "[OK] Proje '${PROJECT_NAME}' başarıyla oluşturuldu."
    - computeResources: {}
      image: 'registry.redhat.io/openshift4/ose-cli:latest'
      imagePullPolicy: IfNotPresent
      name: step-4-add-label
      script: |
        #!/bin/bash
        set -e

        echo "============================================"
        echo " ADIM 4: Label Ekleme"
        echo "============================================"

        PROJECT_NAME="$(params.project-name)"
        PROJECT_LABEL="$(params.project-label)"

        # Label format kontrolü: key=value
        if [[ ! "${PROJECT_LABEL}" =~ ^[a-zA-Z0-9._/-]+=.+$ ]]; then
          echo "[HATA] Label formatı hatalı. Beklenen format: key=value"
          echo "       Girilen: '${PROJECT_LABEL}'"
          exit 1
        fi

        echo "Eklenen label: '${PROJECT_LABEL}' → namespace '${PROJECT_NAME}'"
        oc label namespace "${PROJECT_NAME}" "${PROJECT_LABEL}"

        echo "[OK] Label başarıyla eklendi."
        echo "Mevcut labels:"
        oc get namespace "${PROJECT_NAME}" --show-labels             
    - computeResources: {}
      image: 'registry.redhat.io/openshift4/ose-cli:latest'
      imagePullPolicy: IfNotPresent
      name: step-5-add-pipeline-runner
      script: |
        #!/bin/bash
        set -e

        echo "============================================"
        echo " ADIM 5: Pipeline'ı Başlatan Kullanıcıyı Ekle"
        echo "============================================"

        PROJECT_NAME="$(params.project-name)"

        # Pipeline'i calistiran kullaninci adi sorgulaniyor
        echo "Pipeline'i calistiran kullaninci adi sorgulaniyor..."

        PR_NAME=$(oc get pod "$HOSTNAME" \
          -o jsonpath="{.metadata.labels.tekton\.dev/pipelineRun}")
        echo $PR_NAME
        # OpenShift specific annotation (UI start)
        TRIGGER_USER=$(oc get pipelinerun "${PR_NAME}" \
          -o jsonpath="{.metadata.annotations.pipeline\.openshift\.io/started-by}")

        # Fallback to Tekton label
        if [[ -z "${TRIGGER_USER}" ]]; then
          TRIGGER_USER=$(oc get pipelinerun "${PR_NAME}" \
            -o jsonpath="{.metadata.labels.tekton\.dev/started-by}")
        fi

        # Generic Tekton annotation
        if [[ -z "${TRIGGER_USER}" ]]; then
          TRIGGER_USER=$(oc get pipelinerun "${PR_NAME}" \
            -o jsonpath="{.metadata.annotations.tekton\.dev/createdBy}")
        fi

        # Default when nothing is found
        if [[ -z "${TRIGGER_USER}" ]]; then
          echo "Could not identify triggering user, defaulting to \"admin\"."
          TRIGGER_USER="admin"
        fi

        echo "Bulunan kullanici: ${TRIGGER_USER}"
        echo "Kullanici sorgulama islemleri tamamlandi."

        echo "Pipeline'ı başlatan kullanıcı: '${TRIGGER_USER}'"
        echo "Projeye 'requester' olarak ekleniyor: '${PROJECT_NAME}'"

        oc annotate ns "${PROJECT_NAME}" openshift.io/requester="${TRIGGER_USER}" --overwrite

        echo "[OK] Kullanıcı "${TRIGGER_USER}" projeye 'requester' olarak eklendi."

        # 7. Kullanıcı adını Task result'a yaz → step-7 okuyacak
        echo "Kullanıcı adını Task result'a yaz → step-7 okuyacak"
        echo -n "$TRIGGER_USER" > $(results.pipeline-runner.path)  
    - computeResources: {}
      image: 'docker-anonymous.msp.aselsan.com.tr/openshift/custom-ose-cli:latest'
      imagePullPolicy: Always
      name: step-6-grant-user-role
      script: |
        #!/bin/bash
        set -e

        echo "============================================"
        echo " ADIM 6: Kullanıcıya Rol Atama"
        echo "============================================"

        USER_OR_GROUP_NAMES='$(params.user-or-group-names-json)'
        ROLE_NAME="$(params.role-name)"
        PROJECT_NAME="$(params.project-name)"
        BINDING_NAME="${PROJECT_NAME}-admins"

        echo "RAW: $USER_OR_GROUP_NAMES"

        # JSON'u doğru şekilde parse et
        NAMES=$(echo "$USER_OR_GROUP_NAMES" | jq -r '.[]')

        while IFS= read -r name; do
          name=$(echo "$name" | xargs)

          if [ -n "$name" ]; then
            if [ "$(params.assignment-type)" = "user" ]; then
              oc adm policy add-role-to-user \
                "$ROLE_NAME" "$name" \
                --rolebinding-name="$BINDING_NAME" \
                -n "$PROJECT_NAME"
            else
              oc adm policy add-role-to-group \
                "$ROLE_NAME" "$name" \
                --rolebinding-name="$BINDING_NAME" \
                -n "$PROJECT_NAME"
            fi
          fi
        done <<< "$NAMES"
    - computeResources: {}
      image: 'registry.redhat.io/openshift4/ose-cli:latest'
      imagePullPolicy: IfNotPresent
      name: step-7-resource-quota
      script: |
        #!/bin/bash
        set -e

        echo "============================================"
        echo " ADIM 7: ResourceQuota Oluşturma"
        echo "============================================"

        PROJECT_LABEL="$(params.project-label)"
        FORMATTED_LABEL="$(echo "$PROJECT_LABEL" | sed 's/=/\: /')"

        echo "Kontrol edilen label: '${FORMATTED_LABEL}'"

        cat <<EOF | oc apply -f -
        apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: "$(params.project-name)-quota"
          namespace: $(params.project-name)
          labels: 
            $FORMATTED_LABEL
        spec:
          hard:
            requests.cpu: "$(params.cpu-request)"
            requests.memory: "$(params.memory-request)"
            requests.storage: "$(params.storage-request)"
        EOF
    - computeResources: {}
      image: 'registry.redhat.io/openshift4/ose-cli:latest'
      imagePullPolicy: IfNotPresent
      name: step-8-network-policy
      script: |
        #!/bin/bash
        set -e

        PROJECT_NAME="$(params.project-name)"

        echo "============================================"
        echo " ADIM 8: NetworkPolicy Oluşturma"
        echo "============================================"
        echo "Proje: '${PROJECT_NAME}'"
        echo ""
        echo "Uygulanacak kurallar:"
        echo "  1. Namespace dışından gelen trafik: ENGEL"
        echo "  2. Namespace içi pod-to-pod trafik: SERBEST"
        echo "  3. Tüm çıkış (egress) trafiği     : SERBEST"

        # ── Kural 1 & 2: Ingress politikası ─────────────────────
        # Tüm ingress'i engelle, sadece aynı namespace'den gelenlere izin ver
        cat <<EOF | oc apply -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: deny-from-outside-allow-within-namespace
          namespace: ${PROJECT_NAME}
          annotations:
            description: "Namespace dışından gelen trafiği engeller, namespace içini serbest bırakır"
        spec:
          podSelector: {}        # Namespace'deki tüm pod'lara uygulanır
          policyTypes:
            - Ingress
          ingress:
            - from:
                - podSelector: {}  # Aynı namespace içindeki tüm pod'lardan gelen trafik serbest
        EOF
        # ── Kural 3: Egress politikası ───────────────────────────
        cat <<EOF | oc apply -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-all-egress
          namespace: ${PROJECT_NAME}
          annotations:
            description: "Tüm çıkış trafiğine izin verir"
        spec:
          podSelector: {}        # Namespace'deki tüm pod'lara uygulanır
          policyTypes:
            - Egress
          egress:
            - {}                 # Tüm egress trafiğine izin ver
        EOF

        echo ""
        echo "[OK] NetworkPolicy'ler oluşturuldu:"
        oc get networkpolicy -n "${PROJECT_NAME}" \
          -o custom-columns='NAME:.metadata.name,POD-SELECTOR:.spec.podSelector,POLICY-TYPES:.spec.policyTypes'
    - computeResources: {}
      image: 'registry.redhat.io/openshift4/ose-cli:latest'
      imagePullPolicy: IfNotPresent
      name: step-7-verify-project
      script: |
        #!/bin/bash
        set -e

        PROJECT_NAME="$(params.project-name)"
        PROJECT_DISPLAY_NAME="$(params.project-name)"
        PROJECT_DESCRIPTION="$(params.project-name)"
        PROJECT_LABEL="$(params.project-label)"
        GRANT_USERNAME="$(params.user-or-group-name)"
        GRANT_ROLE="$(params.role-name)"
        QUOTA_CPU="$(params.cpu-request)"
        QUOTA_MEMORY="$(params.memory-request)"
        QUOTA_STORAGE="$(params.storage-request)"
        RUNNER=$(cat "$(results.pipeline-runner.path)" 2>/dev/null || echo "") # step-5'in yazdığı result'tan oku

        ERRORS=0

        echo "============================================"
        echo " ADIM 7: Proje Doğrulama (Verification)"
        echo "============================================"
        echo ""

        # ── 7.1: Proje var mı? ──────────────────────────────────
        echo "[ 7.1 ] Proje varlık kontrolü..."
        if oc get project "${PROJECT_NAME}" &>/dev/null; then
          echo "  [OK] Proje '${PROJECT_NAME}' mevcut."
        else
          echo "  [HATA] Proje '${PROJECT_NAME}' bulunamadı!"
          ERRORS=$((ERRORS + 1))
        fi

        # ── 7.2: Proje adı prod- prefix'i taşıyor mu? ──────────
        echo "[ 7.2 ] Proje adı prefix doğrulaması..."
        ACTUAL_NAME=$(oc get project "${PROJECT_NAME}" \
          -o jsonpath='{.metadata.name}' 2>/dev/null || echo "")
        if [[ "${ACTUAL_NAME}" == "${PROJECT_NAME}" ]]; then
          echo "  [OK] Proje adı eşleşiyor: '${ACTUAL_NAME}'"
        else
          echo "  [HATA] Proje adı uyuşmuyor!"
          echo "         Beklenen : '${PROJECT_NAME}'"
          echo "         Gerçek   : '${ACTUAL_NAME}'"
          ERRORS=$((ERRORS + 1))
        fi

        # ── 7.3: Display Name doğrulaması (girilmişse) ──────────
        if [[ -n "${PROJECT_DISPLAY_NAME}" ]]; then
          echo "[ 7.3 ] Display Name doğrulaması..."
          ACTUAL_DISPLAY=$(oc get namespace "${PROJECT_NAME}" \
            -o jsonpath='{.metadata.annotations.openshift\.io/display-name}' 2>/dev/null || echo "")
          if [[ "${ACTUAL_DISPLAY}" == "${PROJECT_DISPLAY_NAME}" ]]; then
            echo "  [OK] Display Name eşleşiyor: '${ACTUAL_DISPLAY}'"
          else
            echo "  [HATA] Display Name uyuşmuyor!"
            echo "         Beklenen : '${PROJECT_DISPLAY_NAME}'"
            echo "         Gerçek   : '${ACTUAL_DISPLAY}'"
            ERRORS=$((ERRORS + 1))
          fi
        else
          echo "[ 7.3 ] Display Name girilmedi, kontrol atlandı."
        fi

        # ── 7.4: Description doğrulaması (girilmişse) ───────────
        if [[ -n "${PROJECT_DESCRIPTION}" ]]; then
          echo "[ 7.4 ] Description doğrulaması..."
          ACTUAL_DESC=$(oc get namespace "${PROJECT_NAME}" \
            -o jsonpath='{.metadata.annotations.openshift\.io/description}' 2>/dev/null || echo "")
          if [[ "${ACTUAL_DESC}" == "${PROJECT_DESCRIPTION}" ]]; then
            echo "  [OK] Description eşleşiyor: '${ACTUAL_DESC}'"
          else
            echo "  [HATA] Description uyuşmuyor!"
            echo "         Beklenen : '${PROJECT_DESCRIPTION}'"
            echo "         Gerçek   : '${ACTUAL_DESC}'"
            ERRORS=$((ERRORS + 1))
          fi
        else
          echo "[ 7.4 ] Description girilmedi, kontrol atlandı."
        fi

        # ── 7.5: Label doğrulaması ───────────────────────────────
        echo "[ 7.5 ] Label doğrulaması..."
        LABEL_KEY="${PROJECT_LABEL%%=*}"
        LABEL_VAL="${PROJECT_LABEL#*=}"
        ACTUAL_LABEL_VAL=$(oc get namespace "${PROJECT_NAME}" \
          -o jsonpath="{.metadata.labels.${LABEL_KEY}}" 2>/dev/null || echo "")
        if [[ "${ACTUAL_LABEL_VAL}" == "${LABEL_VAL}" ]]; then
          echo "  [OK] Label doğrulandı: '${LABEL_KEY}=${ACTUAL_LABEL_VAL}'"
        else
          echo "  [HATA] Label uyuşmuyor!"
          echo "         Beklenen : '${LABEL_KEY}=${LABEL_VAL}'"
          echo "         Gerçek   : '${LABEL_KEY}=${ACTUAL_LABEL_VAL}'"
          ERRORS=$((ERRORS + 1))
        fi

        # ── 7.6: Pipeline çalıştıran kullanıcı requester olarak eklenmiş mi? ──
        echo "[ 7.6 ] Pipeline başlatıcı kullanıcı (requester) doğrulaması..."

        if [[ -z "${RUNNER}" ]]; then
          echo "  [UYARI] step-5'ten kullanıcı adı alınamadı, requester kontrolü atlandı."
        else
          REQUESTER_BOUND=$(oc get project "${PROJECT_NAME}" -o go-template='{{ index .metadata.annotations "openshift.io/requester" }}' 2>/dev/null || echo "")
          if echo "${REQUESTER_BOUND}" | grep -qw "${RUNNER}"; then
            echo "  [OK] Kullanıcı '${RUNNER}' requester olarak doğrulandı."
          else
            echo "  [HATA] Kullanıcı '${RUNNER}' requester rolünde bulunamadı!"
            echo "         Mevcut requester subjects: '${REQUESTER_BOUND}'"
            ERRORS=$((ERRORS + 1))
          fi
        fi

        # ── 7.7: GRANT_USERNAME, GRANT_ROLE ile eklenmiş mi? ────
        echo "[ 7.7 ] Yetki doğrulaması: '${GRANT_USERNAME}' → '${GRANT_ROLE}'..."
        ROLE_BOUND=$(oc get rolebindings -n "${PROJECT_NAME}" \
          -o jsonpath="{.items[?(@.roleRef.name=='${GRANT_ROLE}')].subjects[*].name}" 2>/dev/null || echo "")
        if echo "${ROLE_BOUND}" | grep -qw "${GRANT_USERNAME}"; then
          echo "  [OK] Kullanıcı '${GRANT_USERNAME}' → '${GRANT_ROLE}' rolü doğrulandı."
        else
          echo "  [HATA] Kullanıcı '${GRANT_USERNAME}' '${GRANT_ROLE}' rolünde bulunamadı!"
          echo "         Mevcut '${GRANT_ROLE}' subjects: '${ROLE_BOUND}'"
          ERRORS=$((ERRORS + 1))
        fi

        # ── 7.8: ResourceQuota doğrulaması (kota girilmişse) ────
        if [[ -n "${QUOTA_CPU}" || -n "${QUOTA_MEMORY}" || -n "${QUOTA_STORAGE}" ]]; then
          echo "[ 7.8 ] ResourceQuota doğrulaması..."
          if oc get resourcequota "${PROJECT_NAME}-quota" -n "${PROJECT_NAME}" &>/dev/null; then
            echo "  [OK] ResourceQuota 'project-quota' mevcut."

            if [[ -n "${QUOTA_CPU}" ]]; then
              ACTUAL_CPU=$(oc get resourcequota "${PROJECT_NAME}-quota" -n "${PROJECT_NAME}" \
                -o jsonpath='{.spec.hard.requests\.cpu}' 2>/dev/null || echo "")
              if [[ "${ACTUAL_CPU}" == "${QUOTA_CPU}" ]]; then
                echo "  [OK] CPU kotası doğrulandı: '${ACTUAL_CPU}'"
              else
                echo "  [HATA] CPU kotası uyuşmuyor! Beklenen: '${QUOTA_CPU}', Gerçek: '${ACTUAL_CPU}'"
                ERRORS=$((ERRORS + 1))
              fi
            fi

            if [[ -n "${QUOTA_MEMORY}" ]]; then
              ACTUAL_MEM=$(oc get resourcequota "${PROJECT_NAME}-quota" -n "${PROJECT_NAME}" \
                -o jsonpath='{.spec.hard.requests\.memory}' 2>/dev/null || echo "")
              if [[ "${ACTUAL_MEM}" == "${QUOTA_MEMORY}" ]]; then
                echo "  [OK] Memory kotası doğrulandı: '${ACTUAL_MEM}'"
              else
                echo "  [HATA] Memory kotası uyuşmuyor! Beklenen: '${QUOTA_MEMORY}', Gerçek: '${ACTUAL_MEM}'"
                ERRORS=$((ERRORS + 1))
              fi
            fi

            if [[ -n "${QUOTA_STORAGE}" ]]; then
              ACTUAL_STOR=$(oc get resourcequota "${PROJECT_NAME}-quota" -n "${PROJECT_NAME}" \
                -o jsonpath='{.spec.hard.requests\.storage}' 2>/dev/null || echo "")
              if [[ "${ACTUAL_STOR}" == "${QUOTA_STORAGE}" ]]; then
                echo "  [OK] Storage kotası doğrulandı: '${ACTUAL_STOR}'"
              else
                echo "  [HATA] Storage kotası uyuşmuyor! Beklenen: '${QUOTA_STORAGE}', Gerçek: '${ACTUAL_STOR}'"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          else
            echo "  [HATA] ResourceQuota 'project-quota' bulunamadı!"
            ERRORS=$((ERRORS + 1))
          fi
        else
          echo "[ 7.8 ] Kota girilmedi, ResourceQuota kontrolü atlandı."
        fi


        # ── 7.10: NetworkPolicy doğrulaması (her zaman kontrol edilir) ──
        echo "[ 7.10 ] NetworkPolicy doğrulaması..."
        NP_ERRORS=0

        if oc get networkpolicy deny-from-outside-allow-within-namespace \
            -n "${PROJECT_NAME}" &>/dev/null; then
          echo "  [OK] NetworkPolicy 'deny-from-outside-allow-within-namespace' mevcut."
        else
          echo "  [HATA] NetworkPolicy 'deny-from-outside-allow-within-namespace' bulunamadı!"
          NP_ERRORS=$((NP_ERRORS + 1))
          ERRORS=$((ERRORS + 1))
        fi

        if oc get networkpolicy allow-all-egress \
            -n "${PROJECT_NAME}" &>/dev/null; then
          echo "  [OK] NetworkPolicy 'allow-all-egress' mevcut."
        else
          echo "  [HATA] NetworkPolicy 'allow-all-egress' bulunamadı!"
          NP_ERRORS=$((NP_ERRORS + 1))
          ERRORS=$((ERRORS + 1))
        fi

        if [[ ${NP_ERRORS} -eq 0 ]]; then
          echo "  [OK] Tüm NetworkPolicy'ler doğrulandı."
        fi

        # ── Sonuç Özeti ──────────────────────────────────────────
        echo ""
        echo "============================================"
        echo " VERİFİCATION SONUCU"
        echo "============================================"
        echo "Proje Adı      : ${PROJECT_NAME}"
        echo "Label          : ${PROJECT_LABEL}"
        echo "Grant User     : ${GRANT_USERNAME} (${GRANT_ROLE})"
        echo "Pipeline Runner: ${RUNNER:-bilinmiyor} (requester)"
        if [[ -n "${QUOTA_CPU}" || -n "${QUOTA_MEMORY}" || -n "${QUOTA_STORAGE}" ]]; then
          echo "ResourceQuota  : CPU=${QUOTA_CPU:-'-'} | Memory=${QUOTA_MEMORY:-'-'} | Storage=${QUOTA_STORAGE:-'-'}"          
        else
          echo "ResourceQuota  : oluşturulmadı (opsiyonel, parametre girilmedi)"
          echo "LimitRange     : oluşturulmadı (opsiyonel, parametre girilmedi)"
        fi
        echo "NetworkPolicy  : deny-from-outside + allow-all-egress"
        echo ""

        if [[ ${ERRORS} -eq 0 ]]; then
          echo "[BAŞARILI] Tüm doğrulamalar geçti. Proje hazır."
        else
          echo "[BAŞARISIZ] ${ERRORS} doğrulama hatası bulundu. Lütfen yukarıdaki hata mesajlarını inceleyin."
          exit 1
        fi
