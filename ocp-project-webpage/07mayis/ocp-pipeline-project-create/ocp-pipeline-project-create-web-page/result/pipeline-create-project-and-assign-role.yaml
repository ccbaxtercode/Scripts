apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: create-project-and-assign-role
  namespace: auth-test
spec:
  params:
    - name: project-name
      type: string
    - name: assignment-type
      type: string
    - name: user-or-group-name
      type: string
    - name: user-or-group-names-json
      type: string
    - name: set-quota
      type: string
    - name: cpu-request
      type: string
    - name: memory-request
      type: string
    - name: storage-request
      type: string
    - name: role-name
      type: string
    - name: project-label
      type: string
  tasks:
    - name: assign-role
      params:
        - name: project-name
          value: $(params.project-name)
        - name: assignment-type
          value: $(params.assignment-type)
        - name: user-or-group-name
          value: $(params.user-or-group-name)
        - name: user-or-group-names-json
          value: $(params.user-or-group-names-json)
        - name: role-name
          value: $(params.role-name)
        - name: set-quota
          value: $(params.set-quota)
        - name: cpu-request
          value: $(params.cpu-request)
        - name: memory-request
          value: $(params.memory-request)
        - name: storage-request
          value: $(params.storage-request)
        - name: project-label
          value: sektor=kdsa
      taskRef:
        kind: Task
        name: assign-role-to-user
