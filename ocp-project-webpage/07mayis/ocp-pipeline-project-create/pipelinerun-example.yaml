# =============================================================================
# Example PipelineRun for create-project-and-assign-role
# Usage: oc create -f pipelinerun-example.yaml
#
# This matches the exact format generated by server.js → triggerPipelineRun()
# =============================================================================
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: create-project-dev-my-project-example
  annotations:
    pipeline.openshift.io/started-by: kadir.demir
spec:
  serviceAccountName: project-creator-sa
  timeouts:
    pipeline: "20m"
  pipelineRef:
    name: create-project-and-assign-role
  params:
    - name: project-name
      value: dev-my-project
    - name: assignment-type
      value: user
    - name: user-or-group-name
      value: kadir.demir
    - name: user-or-group-names-json
      value: '["kadir.demir"]'
    - name: cpu-request
      value: "2"
    - name: memory-request
      value: 4Gi
    - name: storage-request
      value: 10Gi
    - name: role-name
      value: ocp-edit
    - name: project-label
      value: group=dev
