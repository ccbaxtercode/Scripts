# =============================================================================
# Tekton Tasks for OpenShift Project Provisioning Pipeline
# Target: OpenShift 4.x with Tekton Pipelines Operator
# API: tekton.dev/v1
# =============================================================================

# -----------------------------------------------------------------------------
# Task 1: validate-project-inputs
# Validates all pipeline input parameters before any resource creation.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-project-inputs
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Comprehensive validation of all pipeline input parameters including
    project name, label, role, user/group names, and resource quotas.
  params:
    - name: project-name
      type: string
    - name: project-label
      type: string
    - name: assignment-type
      type: string
    - name: user-or-group-name
      type: string
    - name: user-or-group-names-json
      type: string
    - name: role-name
      type: string
    - name: cpu-request
      type: string
    - name: memory-request
      type: string
    - name: storage-request
      type: string
  results:
    - name: validation-status
      description: "passed or failed"
  steps:
    - name: validate
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[validate-inputs]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        echo "$LOG_PREFIX $(ts) === Input Validation Started ==="

        PROJECT_NAME="$(params.project-name)"
        PROJECT_LABEL="$(params.project-label)"
        ASSIGN_TYPE="$(params.assignment-type)"
        NAMES_JSON='$(params.user-or-group-names-json)'
        ROLE="$(params.role-name)"
        CPU="$(params.cpu-request)"
        MEMORY="$(params.memory-request)"
        STORAGE="$(params.storage-request)"

        ERRORS=()

        # --- 1. Validate project-name: RFC 1123 DNS label ---
        echo "$LOG_PREFIX $(ts) [1/9] Validating project-name: $PROJECT_NAME"
        if [ ${#PROJECT_NAME} -gt 63 ]; then
          ERRORS+=("project-name must be 63 characters or fewer (got ${#PROJECT_NAME})")
        fi
        if ! echo "$PROJECT_NAME" | grep -qE '^[a-z][a-z0-9-]*[a-z0-9]$'; then
          ERRORS+=("project-name '$PROJECT_NAME' does not match RFC 1123")
        fi

        # --- 2. Validate prefix (dev-, test-, prod-) ---
        echo "$LOG_PREFIX $(ts) [2/9] Validating prefix"
        if [[ ! "$PROJECT_NAME" =~ ^(dev|test|prod)- ]]; then
          ERRORS+=("project-name must start with dev-, test- or prod- prefix. Got: '$PROJECT_NAME'")
        fi

        # --- 3. Consecutive dash check ---
        if [[ "$PROJECT_NAME" == *--* ]]; then
          ERRORS+=("project-name cannot contain consecutive dashes ('--'). Got: '$PROJECT_NAME'")
        fi

        # --- 4. Min suffix length: 3 chars after prefix ---
        SUFFIX="${PROJECT_NAME#*-}"
        if [[ ${#SUFFIX} -lt 3 ]]; then
          ERRORS+=("project-name must have at least 3 characters after prefix (got ${#SUFFIX})")
        fi

        # --- 5. Validate project-label format ---
        echo "$LOG_PREFIX $(ts) [3/9] Validating project-label: $PROJECT_LABEL"
        if [[ ! "$PROJECT_LABEL" =~ ^[a-zA-Z0-9._/-]+=.+$ ]]; then
          ERRORS+=("project-label '$PROJECT_LABEL' does not match key=value format")
        fi

        # --- 6. Validate assignment-type ---
        echo "$LOG_PREFIX $(ts) [4/9] Validating assignment-type: $ASSIGN_TYPE"
        if [[ "$ASSIGN_TYPE" != "user" && "$ASSIGN_TYPE" != "group" ]]; then
          ERRORS+=("assignment-type must be 'user' or 'group'. Got: '$ASSIGN_TYPE'")
        fi

        # --- 7. Validate user-or-group-names-json ---
        echo "$LOG_PREFIX $(ts) [5/9] Validating user-or-group-names-json"
        NAME_COUNT=0
        if ! python3 -c "
        import json, sys
        try:
            names = json.loads('''$NAMES_JSON''')
            assert isinstance(names, list), 'must be a JSON array'
            assert len(names) > 0, 'must not be empty'
            for n in names:
                assert isinstance(n, str) and n.strip(), f'invalid entry: {n}'
            print(len(names))
        except Exception as e:
            print('ERROR:' + str(e), file=sys.stderr)
            sys.exit(1)
        " 2>/dev/null; then
          ERRORS+=("user-or-group-names-json is not a valid non-empty JSON array of strings")
        else
          NAME_COUNT=$(python3 -c "
        import json
        names = json.loads('''$NAMES_JSON''')
        print(len(names))
        " 2>/dev/null || echo "0")
        fi
        echo "$LOG_PREFIX $(ts)   User/group count: $NAME_COUNT"

        # --- 8. Validate role-name ---
        echo "$LOG_PREFIX $(ts) [6/9] Validating role-name: $ROLE"
        if [ -z "$ROLE" ]; then
          ERRORS+=("role-name cannot be empty")
        fi
        if [[ "$ROLE" =~ ^(cluster-admin|self-provisioner)$ ]]; then
          ERRORS+=("role-name '$ROLE' is forbidden (least privilege)")
        fi
        if [[ ! "$ROLE" =~ ^ocp- ]]; then
          ERRORS+=("role-name must start with 'ocp-' prefix. Got: '$ROLE'")
        fi

        # --- 9. Validate quota values ---
        echo "$LOG_PREFIX $(ts) [7/9] Validating cpu-request: $CPU"
        if ! echo "$CPU" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
          ERRORS+=("cpu-request must be a positive number (e.g. 1, 0.5, 2). Got: '$CPU'")
        fi

        echo "$LOG_PREFIX $(ts) [8/9] Validating memory-request: $MEMORY"
        if ! echo "$MEMORY" | grep -qE '^[0-9]+(\.[0-9]+)?[GM]i$'; then
          ERRORS+=("memory-request must be number + Gi/Mi (e.g. 4Gi, 512Mi). Got: '$MEMORY'")
        fi

        echo "$LOG_PREFIX $(ts) [9/9] Validating storage-request: $STORAGE"
        if ! echo "$STORAGE" | grep -qE '^[0-9]+(\.[0-9]+)?[GM]i$'; then
          ERRORS+=("storage-request must be number + Gi/Mi (e.g. 10Gi, 100Gi). Got: '$STORAGE'")
        fi

        # --- Report results ---
        if [ ${#ERRORS[@]} -gt 0 ]; then
          echo ""
          echo "$LOG_PREFIX $(ts) === VALIDATION FAILED ==="
          for err in "${ERRORS[@]}"; do
            echo "$LOG_PREFIX   ERROR: $err"
          done
          printf "failed" > "$(results.validation-status.path)"
          exit 1
        fi

        echo "$LOG_PREFIX $(ts) === All Inputs Validated Successfully ==="
        printf "passed" > "$(results.validation-status.path)"

---
# -----------------------------------------------------------------------------
# Task 2: check-namespace-existence
# Fails the pipeline if the namespace already exists.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-namespace-existence
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Checks if the target namespace already exists. Fails if it does.
  params:
    - name: project-name
      type: string
  results:
    - name: existence-status
      description: "not-found (safe to create) or exists (abort)"
  steps:
    - name: check
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[check-namespace]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        echo "$LOG_PREFIX $(ts) Checking if namespace '$PROJECT' already exists..."

        if oc get namespace "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts) ERROR: Namespace '$PROJECT' already exists. Aborting pipeline."
          printf "exists" > "$(results.existence-status.path)"
          exit 1
        fi

        echo "$LOG_PREFIX $(ts) Namespace '$PROJECT' does not exist. Safe to create."
        printf "not-found" > "$(results.existence-status.path)"

---
# -----------------------------------------------------------------------------
# Task 3: create-project-namespace
# Creates the namespace and applies the project label.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-project-namespace
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Creates the namespace using 'oc new-project' and applies the project label.
  params:
    - name: project-name
      type: string
    - name: project-label
      type: string
  results:
    - name: creation-status
      description: "created or failed"
  steps:
    - name: create-namespace
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[create-namespace]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        PROJECT_LABEL="$(params.project-label)"

        echo "$LOG_PREFIX $(ts) Creating namespace '$PROJECT'..."

        oc new-project "$PROJECT" --skip-config-write=true \
          --display-name="$PROJECT" \
          --description="Provisioned by Tekton Pipeline"

        echo "$LOG_PREFIX $(ts) Namespace '$PROJECT' created successfully."

        # --- Apply project label ---
        echo "$LOG_PREFIX $(ts) Applying label: $PROJECT_LABEL"
        oc label namespace "$PROJECT" "$PROJECT_LABEL" --overwrite
        echo "$LOG_PREFIX $(ts) Label '$PROJECT_LABEL' applied."

        echo "$LOG_PREFIX $(ts) === Namespace '$PROJECT' fully configured ==="
        printf "created" > "$(results.creation-status.path)"
---

# -----------------------------------------------------------------------------
# Task 4: set-requester-annotation
# Reads the pipeline-started-by annotation from the PipelineRun and
# sets it as openshift.io/requester annotation on the namespace.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: set-requester-annotation
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Gets the pipeline runner username from the PipelineRun annotation
    (pipeline.openshift.io/started-by) and annotates the namespace
    with openshift.io/requester.
  params:
    - name: project-name
      type: string
  results:
    - name: requester
      description: "Username of the pipeline runner"
    - name: requester-status
      description: "set or failed"
  steps:
    - name: set-requester
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[set-requester]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"

        echo "$LOG_PREFIX $(ts) Looking up pipeline runner..."

        # Get PipelineRun name from pod labels
        PR_NAME=$(oc get pod "$HOSTNAME" \
          -o jsonpath="{.metadata.labels.tekton\.dev/pipelineRun}" 2>/dev/null || echo "")

        if [ -z "$PR_NAME" ]; then
          echo "$LOG_PREFIX $(ts) WARN: Could not determine PipelineRun name from pod labels"
        else
          echo "$LOG_PREFIX $(ts) PipelineRun: $PR_NAME"
        fi

        # Try pipeline.openshift.io/started-by annotation (set by OpenShift UI)
        TRIGGER_USER=""
        if [ -n "$PR_NAME" ]; then
          TRIGGER_USER=$(oc get pipelinerun "$PR_NAME" \
            -o jsonpath="{.metadata.annotations.pipeline\.openshift\.io/started-by}" 2>/dev/null || echo "")

          # Fallback to tekton.dev/started-by label
          if [ -z "$TRIGGER_USER" ]; then
            TRIGGER_USER=$(oc get pipelinerun "$PR_NAME" \
              -o jsonpath="{.metadata.labels.tekton\.dev/started-by}" 2>/dev/null || echo "")
          fi

          # Fallback to tekton.dev/createdBy annotation
          if [ -z "$TRIGGER_USER" ]; then
            TRIGGER_USER=$(oc get pipelinerun "$PR_NAME" \
              -o jsonpath="{.metadata.annotations.tekton\.dev/createdBy}" 2>/dev/null || echo "")
          fi
        fi

        # Default fallback
        if [ -z "$TRIGGER_USER" ]; then
          echo "$LOG_PREFIX $(ts) Could not identify triggering user, defaulting to 'pipeline-runner'."
          TRIGGER_USER="pipeline-runner"
        fi

        echo "$LOG_PREFIX $(ts) Pipeline runner: $TRIGGER_USER"

        # --- Set requester annotation on namespace ---
        echo "$LOG_PREFIX $(ts) Setting openshift.io/requester=$TRIGGER_USER on namespace '$PROJECT'..."
        oc annotate namespace "$PROJECT" "openshift.io/requester=$TRIGGER_USER" --overwrite

        echo "$LOG_PREFIX $(ts) === Requester annotation set: $TRIGGER_USER ==="
        echo -n "$TRIGGER_USER" > "$(results.requester.path)"
        printf "set" > "$(results.requester-status.path)"

---

# -----------------------------------------------------------------------------
# Task 5: assign-roles-to-users
# Creates RoleBindings for each user/group from JSON array.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: assign-roles-to-users
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Assigns roles to users or groups. Parses user-or-group-names-json
    JSON array and creates RoleBindings using oc adm policy.
  params:
    - name: project-name
      type: string
    - name: assignment-type
      type: string
      description: "user or group"
    - name: user-or-group-names-json
      type: string
      description: "JSON array of names: [\"ali\",\"veli\"]"
    - name: role-name
      type: string
      description: "ClusterRole name"
  results:
    - name: binding-count
      description: "Number of role bindings created"
    - name: binding-status
      description: "created or failed"
  steps:
    - name: assign-roles
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[assign-roles]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        ASSIGN_TYPE="$(params.assignment-type)"
        NAMES_JSON='$(params.user-or-group-names-json)'
        ROLE="$(params.role-name)"
        BINDING_NAME="${PROJECT}-admins"
        COUNT=0

        echo "$LOG_PREFIX $(ts) Assigning role '$ROLE' to $ASSIGN_TYPE(s) in '$PROJECT'..."
        echo "$LOG_PREFIX $(ts) Names JSON: $NAMES_JSON"

        NAMES=$(echo "$NAMES_JSON" | jq -r '.[]' 2>/dev/null || echo "")

        if [ -z "$NAMES" ]; then
          echo "$LOG_PREFIX $(ts) ERROR: No names found in user-or-group-names-json"
          printf "0" > "$(results.binding-count.path)"
          printf "failed" > "$(results.binding-status.path)"
          exit 1
        fi

        while IFS= read -r name; do
          name=$(echo "$name" | xargs)
          [ -z "$name" ] && continue

          echo "$LOG_PREFIX $(ts) Processing: $ASSIGN_TYPE/$name -> $ROLE"

          if [ "$ASSIGN_TYPE" = "user" ]; then
            oc adm policy add-role-to-user "$ROLE" "$name" \
              --rolebinding-name="$BINDING_NAME" -n "$PROJECT"
            echo "$LOG_PREFIX $(ts)   RoleBinding: user/$name -> $ROLE"
          else
            oc adm policy add-role-to-group "$ROLE" "$name" \
              --rolebinding-name="$BINDING_NAME" -n "$PROJECT"
            echo "$LOG_PREFIX $(ts)   RoleBinding: group/$name -> $ROLE"
          fi
          COUNT=$((COUNT + 1))
        done <<< "$NAMES"

        echo "$LOG_PREFIX $(ts) === $COUNT role binding(s) created ==="
        printf "%d" "$COUNT" > "$(results.binding-count.path)"
        printf "created" > "$(results.binding-status.path)"

---
# -----------------------------------------------------------------------------
# Task 6: create-project-quota
# Creates a ResourceQuota in the target namespace.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-project-quota
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Creates a ResourceQuota with CPU, memory and storage request limits.
  params:
    - name: project-name
      type: string
    - name: cpu-request
      type: string
    - name: memory-request
      type: string
    - name: storage-request
      type: string
    - name: project-label
      type: string
  results:
    - name: quota-status
      description: "created or failed"
  steps:
    - name: create-quota
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[create-quota]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        CPU="$(params.cpu-request)"
        MEMORY="$(params.memory-request)"
        STORAGE="$(params.storage-request)"
        PROJECT_LABEL="$(params.project-label)"
        FORMATTED_LABEL="$(echo "$PROJECT_LABEL" | sed 's/=/: /')"

        echo "$LOG_PREFIX $(ts) Creating ResourceQuota in '$PROJECT'..."
        echo "$LOG_PREFIX $(ts)   CPU: $CPU, Memory: $MEMORY, Storage: $STORAGE"

        cat <<EOF | oc apply -f -
        apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: ${PROJECT}-quota
          namespace: ${PROJECT}
          labels:
            ${FORMATTED_LABEL}
        spec:
          hard:
            requests.cpu: "${CPU}"
            requests.memory: "${MEMORY}"
            requests.storage: "${STORAGE}"
        EOF

        echo "$LOG_PREFIX $(ts) ResourceQuota '${PROJECT}-quota' created."
        oc get resourcequota "${PROJECT}-quota" -n "$PROJECT" -o yaml | head -30
        echo "$LOG_PREFIX $(ts) === ResourceQuota created successfully ==="
        printf "created" > "$(results.quota-status.path)"

---
# -----------------------------------------------------------------------------
# Task 7: create-network-policies
# Creates default-deny-ingress and allow-same-namespace NetworkPolicies.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-network-policies
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Creates two NetworkPolicies:
    1. deny-from-outside-allow-within-namespace — blocks external ingress,
       allows internal pod-to-pod traffic
    2. allow-all-egress — permits all egress traffic
  params:
    - name: project-name
      type: string
  results:
    - name: networkpolicy-status
      description: "created or failed"
  steps:
    - name: create-policies
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[network-policies]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"

        echo "$LOG_PREFIX $(ts) Creating NetworkPolicies in '$PROJECT'..."
        echo ""
        echo "$LOG_PREFIX $(ts)   Policy 1: Block external ingress, allow internal pod-to-pod"
        echo "$LOG_PREFIX $(ts)   Policy 2: Allow all egress traffic"

        # --- Policy 1: Ingress ---
        cat <<EOF | oc apply -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: deny-from-outside-allow-within-namespace
          namespace: ${PROJECT}
          annotations:
            description: "Blocks external ingress, allows internal pod-to-pod traffic"
        spec:
          podSelector: {}
          policyTypes:
            - Ingress
          ingress:
            - from:
                - podSelector: {}
        EOF

        # --- Policy 2: Egress ---
        cat <<EOF | oc apply -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-all-egress
          namespace: ${PROJECT}
          annotations:
            description: "Allows all egress traffic"
        spec:
          podSelector: {}
          policyTypes:
            - Egress
          egress:
            - {}
        EOF

        echo ""
        echo "$LOG_PREFIX $(ts) NetworkPolicies created:"
        oc get networkpolicy -n "$PROJECT" \
          -o custom-columns='NAME:.metadata.name,POLICY-TYPES:.spec.policyTypes[]'

        printf "created" > "$(results.networkpolicy-status.path)"

---
# -----------------------------------------------------------------------------
# Task 8: verify-project-resources
# Verifies all resources were created correctly.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-project-resources
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Final verification step. Checks namespace, label, RoleBindings,
    ResourceQuota and NetworkPolicies.
  params:
    - name: project-name
      type: string
    - name: project-label
      type: string
    - name: role-name
      type: string
    - name: cpu-request
      type: string
    - name: memory-request
      type: string
    - name: storage-request
      type: string
    - name: assignment-type
      type: string
    - name: user-or-group-name
      type: string
  results:
    - name: verification-status
      description: "passed or failed"
  steps:
    - name: verify
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[verify-resources]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        PROJECT_LABEL="$(params.project-label)"
        ROLE="$(params.role-name)"
        CPU="$(params.cpu-request)"
        MEMORY="$(params.memory-request)"
        STORAGE="$(params.storage-request)"
        ASSIGN_TYPE="$(params.assignment-type)"
        GRANT_NAME="$(params.user-or-group-name)"
        ERRORS=0

        echo "$LOG_PREFIX $(ts) === Starting Final Verification ==="

        # --- 1. Namespace exists ---
        echo "$LOG_PREFIX $(ts) [1/7] Checking namespace..."
        if oc get namespace "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts)   PASS: Namespace '$PROJECT' exists"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: Namespace '$PROJECT' not found"
          ERRORS=$((ERRORS + 1))
        fi

        # --- 2. Project name match ---
        echo "$LOG_PREFIX $(ts) [2/7] Checking project name..."
        ACTUAL_NAME=$(oc get project "$PROJECT" -o jsonpath='{.metadata.name}' 2>/dev/null || echo "")
        if [ "$ACTUAL_NAME" = "$PROJECT" ]; then
          echo "$LOG_PREFIX $(ts)   PASS: Project name matches: '$ACTUAL_NAME'"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: Name mismatch. Expected='$PROJECT' Actual='$ACTUAL_NAME'"
          ERRORS=$((ERRORS + 1))
        fi

        # --- 3. Label ---
        echo "$LOG_PREFIX $(ts) [3/7] Checking label..."
        LABEL_KEY="${PROJECT_LABEL%%=*}"
        LABEL_VAL="${PROJECT_LABEL#*=}"
        ACTUAL_LABEL=$(oc get namespace "$PROJECT" -o jsonpath="{.metadata.labels.${LABEL_KEY}}" 2>/dev/null || echo "")
        if [ "$ACTUAL_LABEL" = "$LABEL_VAL" ]; then
          echo "$LOG_PREFIX $(ts)   PASS: Label '$PROJECT_LABEL' verified"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: Label mismatch. Expected='$LABEL_VAL' Actual='$ACTUAL_LABEL'"
          ERRORS=$((ERRORS + 1))
        fi

        # --- 4. RoleBindings ---
        echo "$LOG_PREFIX $(ts) [4/7] Checking RoleBindings..."
        RB_COUNT=$(oc get rolebindings -n "$PROJECT" --no-headers 2>/dev/null | wc -l | tr -d ' ')
        if [ "$RB_COUNT" -gt 0 ]; then
          echo "$LOG_PREFIX $(ts)   PASS: $RB_COUNT RoleBinding(s) found"
          echo "$LOG_PREFIX $(ts)     RoleBindings:"
          oc get rolebindings -n "$PROJECT" --no-headers 2>/dev/null | while read -r line; do
            echo "$LOG_PREFIX $(ts)       $line"
          done

          # Check if the first granted user/group has the expected role
          FIRST_NAME=$(echo "$GRANT_NAME" | cut -d',' -f1 | xargs)
          echo "$LOG_PREFIX $(ts)     Checking '$FIRST_NAME' has role '$ROLE'..."
          ROLE_BOUND=$(oc get rolebindings -n "$PROJECT" \
            -o jsonpath="{.items[?(@.roleRef.name=='${ROLE}')].subjects[*].name}" 2>/dev/null || echo "")
          if echo "$ROLE_BOUND" | grep -qw "$FIRST_NAME"; then
            echo "$LOG_PREFIX $(ts)   PASS: '$FIRST_NAME' has role '$ROLE'"
          else
            echo "$LOG_PREFIX $(ts)   FAIL: '$FIRST_NAME' not found in role '$ROLE' subjects"
            ERRORS=$((ERRORS + 1))
          fi
        else
          echo "$LOG_PREFIX $(ts)   FAIL: No RoleBindings found"
          ERRORS=$((ERRORS + 1))
        fi

        # --- 5. ResourceQuota ---
        echo "$LOG_PREFIX $(ts) [5/7] Checking ResourceQuota..."
        QUOTA_NAME="${PROJECT}-quota"
        if oc get resourcequota "$QUOTA_NAME" -n "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts)   PASS: ResourceQuota '$QUOTA_NAME' exists"

          ACTUAL_CPU=$(oc get resourcequota "$QUOTA_NAME" -n "$PROJECT" \
            -o jsonpath='{.spec.hard.requests\.cpu}' 2>/dev/null || echo "")
          if [ "$ACTUAL_CPU" = "$CPU" ]; then
            echo "$LOG_PREFIX $(ts)   PASS: CPU quota matches: $ACTUAL_CPU"
          else
            echo "$LOG_PREFIX $(ts)   FAIL: CPU Expected='$CPU' Actual='$ACTUAL_CPU'"
            ERRORS=$((ERRORS + 1))
          fi

          ACTUAL_MEM=$(oc get resourcequota "$QUOTA_NAME" -n "$PROJECT" \
            -o jsonpath='{.spec.hard.requests\.memory}' 2>/dev/null || echo "")
          if [ "$ACTUAL_MEM" = "$MEMORY" ]; then
            echo "$LOG_PREFIX $(ts)   PASS: Memory quota matches: $ACTUAL_MEM"
          else
            echo "$LOG_PREFIX $(ts)   FAIL: Memory Expected='$MEMORY' Actual='$ACTUAL_MEM'"
            ERRORS=$((ERRORS + 1))
          fi

          ACTUAL_STOR=$(oc get resourcequota "$QUOTA_NAME" -n "$PROJECT" \
            -o jsonpath='{.spec.hard.requests\.storage}' 2>/dev/null || echo "")
          if [ "$ACTUAL_STOR" = "$STORAGE" ]; then
            echo "$LOG_PREFIX $(ts)   PASS: Storage quota matches: $ACTUAL_STOR"
          else
            echo "$LOG_PREFIX $(ts)   FAIL: Storage Expected='$STORAGE' Actual='$ACTUAL_STOR'"
            ERRORS=$((ERRORS + 1))
          fi
        else
          echo "$LOG_PREFIX $(ts)   FAIL: ResourceQuota '$QUOTA_NAME' not found"
          ERRORS=$((ERRORS + 1))
        fi

        # --- 6. NetworkPolicies ---
        echo "$LOG_PREFIX $(ts) [6/7] Checking NetworkPolicies..."

        if oc get networkpolicy deny-from-outside-allow-within-namespace -n "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts)   PASS: 'deny-from-outside-allow-within-namespace' exists"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: Ingress NetworkPolicy not found"
          ERRORS=$((ERRORS + 1))
        fi

        if oc get networkpolicy allow-all-egress -n "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts)   PASS: 'allow-all-egress' exists"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: Egress NetworkPolicy not found"
          ERRORS=$((ERRORS + 1))
        fi

        # --- 7. Pipeline runner annotation ---
        echo "$LOG_PREFIX $(ts) [7/7] Checking pipeline runner annotation..."
        REQ_ANN=$(oc get namespace "$PROJECT" -o jsonpath='{.metadata.annotations.openshift\.io/requester}' 2>/dev/null || echo "")
        if [ -n "$REQ_ANN" ]; then
          echo "$LOG_PREFIX $(ts)   PASS: Requester annotation present: $REQ_ANN"
        else
          echo "$LOG_PREFIX $(ts)   WARN: Requester annotation not found (optional)"
        fi

        # --- 8. Remove default admin role from pipeline SA ---
        echo "$LOG_PREFIX $(ts) [8/8] Removing default admin from pipeline SA..."
        oc adm policy remove-role-from-user admin -z project-creator-sa -n "$PROJECT" 2>/dev/null || true
        echo "$LOG_PREFIX $(ts)   PASS: Admin removed from project-creator-sa"

        # --- Summary ---
        echo ""
        echo "$LOG_PREFIX $(ts) =========================================="
        if [ $ERRORS -eq 0 ]; then
          echo "$LOG_PREFIX $(ts) === VERIFICATION PASSED ==="
          echo "$LOG_PREFIX $(ts) =========================================="
          printf "passed" > "$(results.verification-status.path)"
        else
          echo "$LOG_PREFIX $(ts) === VERIFICATION FAILED ($ERRORS errors) ==="
          echo "$LOG_PREFIX $(ts) =========================================="
          printf "failed" > "$(results.verification-status.path)"
          exit 1
        fi

---
# -----------------------------------------------------------------------------
# Task 9: rollback-project
# Deletes the namespace on pipeline failure.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rollback-project
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Rollback task that runs on pipeline failure. Deletes the namespace
    which cascades and removes all resources within it.
  params:
    - name: project-name
      type: string
  results:
    - name: rollback-status
      description: "rolled-back, not-needed, or failed"
  steps:
    - name: rollback
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        LOG_PREFIX="[rollback]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"

        echo "$LOG_PREFIX $(ts) === Rollback Triggered ==="
        echo "$LOG_PREFIX $(ts) Pipeline failed. Initiating cleanup for namespace '$PROJECT'..."

        if ! oc get namespace "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts) Namespace '$PROJECT' does not exist. No rollback needed."
          printf "not-needed" > "$(results.rollback-status.path)"
          exit 0
        fi

        echo "$LOG_PREFIX $(ts) Namespace '$PROJECT' found. Deleting..."

        RETRY_COUNT=0
        MAX_RETRIES=3
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if oc delete namespace "$PROJECT" --wait=true --timeout=60s 2>/dev/null; then
            echo "$LOG_PREFIX $(ts) Namespace '$PROJECT' deleted successfully."
            printf "rolled-back" > "$(results.rollback-status.path)"
            exit 0
          fi
          RETRY_COUNT=$((RETRY_COUNT + 1))
          echo "$LOG_PREFIX $(ts) Delete attempt $RETRY_COUNT/$MAX_RETRIES failed. Retrying in 5s..."
          sleep 5
        done

        echo "$LOG_PREFIX $(ts) ERROR: Failed to delete namespace '$PROJECT' after $MAX_RETRIES attempts."
        echo "$LOG_PREFIX $(ts) Manual intervention required."
        printf "failed" > "$(results.rollback-status.path)"
        exit 1
