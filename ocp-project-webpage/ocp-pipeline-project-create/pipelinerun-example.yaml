# =============================================================================
# Example PipelineRun for provision-openshift-project
# Usage: oc create -f pipelinerun-example.yaml
# =============================================================================
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: provision-project-run-
  namespace: openshift-project-app
  labels:
    app.kubernetes.io/part-of: project-provisioning
    tekton.dev/pipeline: provision-openshift-project
  annotations:
    openshift.io/requester: "kadir.demir"
spec:
  pipelineRef:
    name: provision-openshift-project
  taskRunTemplate:
    serviceAccountName: pipeline-sa
  timeouts:
    pipeline: "15m"
    tasks: "10m"
    finally: "5m"
  params:
    - name: project-name
      value: "dev-backend-team"
    - name: labels
      value: '{"env":"development","team":"backend","managed-by":"tekton"}'
    - name: requester
      value: "kadir.demir"
    - name: role-bindings
      value: |
        [
          {"type": "user",  "name": "kadir.demir",   "role": "admin"},
          {"type": "user",  "name": "ahmet.yilmaz",  "role": "edit"},
          {"type": "group", "name": "backend-devs",   "role": "view"}
        ]
    - name: resource-quota
      value: '{"cpu":"4","memory":"8Gi","storage":"50Gi","pods":"20","configmaps":"50","secrets":"30"}'
    - name: annotations
      value: '{"owner":"backend-team","cost-center":"CC-1234","environment":"development"}'
    # Optional LimitRange overrides (defaults used if omitted)
    # - name: default-cpu-limit
    #   value: "500m"
    # - name: default-cpu-request
    #   value: "100m"
    # - name: default-memory-limit
    #   value: "512Mi"
    # - name: default-memory-request
    #   value: "128Mi"
    # - name: max-cpu
    #   value: "2"
    # - name: max-memory
    #   value: "4Gi"
