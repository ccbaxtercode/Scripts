apiVersion: v1
kind: Namespace
metadata:
  name: project-creator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-creator-web-sa
  namespace: project-creator
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"project-creator-web"}}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-creator-web-access
rules:
  # Projects — get/list (check-project-name endpoint)
  - apiGroups: ["project.openshift.io"]
    resources: ["projects"]
    verbs: ["get", "list"]
  # Users — list (users-groups endpoint)
  - apiGroups: ["user.openshift.io"]
    resources: ["users"]
    verbs: ["list"]
  # Groups — list (users-groups endpoint + getUserGroups for auth)
  - apiGroups: ["user.openshift.io"]
    resources: ["groups"]
    verbs: ["list"]
  # ClusterRoles — list (getRoles endpoint, ocp- prefixed roles)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["list"]
  # PipelineRuns — create/get (trigger + status polling)
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get"]
  # Console URL — get (getConsoleUrl)
  - apiGroups: ["operator.openshift.io"]
    resources: ["consoles"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: project-creator-web-sa-binding
subjects:
  - kind: ServiceAccount
    name: project-creator-web-sa
    namespace: project-creator
roleRef:
  kind: ClusterRole
  name: project-creator-web-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-creator-web
  namespace: project-creator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-creator-web
  template:
    metadata:
      labels:
        app: project-creator-web
    spec:
      serviceAccountName: project-creator-web-sa
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: project-creator-web:latest
          ports:
            - containerPort: 8080
          env:
            - name: ALLOWED_GROUPS
              value: "project-creators"
            - name: TEAM_DEV_PREFIX
              value: "dev-"
            - name: TEAM_DEV_GROUP
              value: "group-dev"
            - name: TEAM_TEST_PREFIX
              value: "test-"
            - name: TEAM_TEST_GROUP
              value: "group-test"
            - name: TEAM_PROD_PREFIX
              value: "prod-"
            - name: TEAM_PROD_GROUP
              value: "group-prod"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy:latest
          args:
            - --openshift-service-account=project-creator-web-sa
            - --upstream=http://localhost:8080
            - --provider=openshift
            - --https-port=8443
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret=$(COOKIE_SECRET)
            - --openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - --pass-user-headers=true
          env:
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: project-creator-web-secrets
                  key: cookie-secret
          ports:
            - containerPort: 8443
              name: https
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tls-cert
              mountPath: /etc/tls/private
      volumes:
        - name: tls-cert
          secret:
            secretName: project-creator-web-tls
---
apiVersion: v1
kind: Service
metadata:
  name: project-creator-web
  namespace: project-creator
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: project-creator-web-tls
spec:
  ports:
    - port: 443
      targetPort: 8443
      name: https
  selector:
    app: project-creator-web
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: project-creator-web
  namespace: project-creator
spec:
  to:
    kind: Service
    name: project-creator-web
  tls:
    termination: reencrypt
  port:
    targetPort: https
---
# Generate cookie-secret before deploying:
#   openssl rand -base64 32
# Then replace REPLACE_WITH_GENERATED_SECRET with the output.
apiVersion: v1
kind: Secret
metadata:
  name: project-creator-web-secrets
  namespace: project-creator
type: Opaque
stringData:
  cookie-secret: REPLACE_WITH_GENERATED_SECRET
