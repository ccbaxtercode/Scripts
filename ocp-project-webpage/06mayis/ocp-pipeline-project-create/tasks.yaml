# =============================================================================
# Tekton Tasks for OpenShift Project Provisioning Pipeline
# Target: OpenShift 4.19.21 with Tekton Pipelines Operator
# API: tekton.dev/v1
# =============================================================================

# -----------------------------------------------------------------------------
# Task 1: validate-inputs
# Validates all pipeline input parameters before any resource creation.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-inputs
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Validates project-name (RFC 1123 + dev- prefix), labels, annotations,
    role-bindings, resource-quota and requester parameters.
  params:
    - name: project-name
      type: string
    - name: labels
      type: string
    - name: annotations
      type: string
    - name: requester
      type: string
    - name: role-bindings
      type: string
    - name: resource-quota
      type: string
  results:
    - name: validation-status
      description: "passed or failed"
  steps:
    - name: validate
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[validate-inputs]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        echo "$LOG_PREFIX $(ts) === Input Validation Started ==="

        PROJECT_NAME="$(params.project-name)"
        LABELS='$(params.labels)'
        ANNOTATIONS='$(params.annotations)'
        REQUESTER="$(params.requester)"
        ROLE_BINDINGS='$(params.role-bindings)'
        RESOURCE_QUOTA='$(params.resource-quota)'

        ERRORS=()

        # --- 1. Validate project-name: RFC 1123 DNS label ---
        echo "$LOG_PREFIX $(ts) Validating project-name: $PROJECT_NAME"
        if [ ${#PROJECT_NAME} -gt 63 ]; then
          ERRORS+=("project-name must be 63 characters or fewer (got ${#PROJECT_NAME})")
        fi
        if ! echo "$PROJECT_NAME" | grep -qE '^[a-z][a-z0-9-]*[a-z0-9]$'; then
          ERRORS+=("project-name '$PROJECT_NAME' does not match RFC 1123: must start with lowercase letter, contain only [a-z0-9-], end with letter or digit")
        fi

        # --- 2. Validate dev- prefix ---
        if [[ ! "$PROJECT_NAME" =~ ^dev- ]]; then
          ERRORS+=("project-name must start with 'dev-' prefix. Got: '$PROJECT_NAME'")
        fi

        # --- 3. Validate requester is not empty ---
        if [ -z "$REQUESTER" ]; then
          ERRORS+=("requester parameter cannot be empty")
        fi

        # --- 4. Validate labels JSON ---
        echo "$LOG_PREFIX $(ts) Validating labels JSON"
        if ! python3 -c "
        import json, sys
        try:
            d = json.loads('''$LABELS''')
            assert isinstance(d, dict), 'labels must be a JSON object'
            for k, v in d.items():
                assert isinstance(k, str) and isinstance(v, str), f'label key/value must be strings: {k}={v}'
        except Exception as e:
            print(str(e), file=sys.stderr)
            sys.exit(1)
        " 2>/dev/null; then
          ERRORS+=("labels is not a valid JSON object with string key-value pairs")
        fi

        # --- 5. Validate annotations JSON ---
        echo "$LOG_PREFIX $(ts) Validating annotations JSON"
        if ! python3 -c "
        import json, sys
        try:
            d = json.loads('''$ANNOTATIONS''')
            assert isinstance(d, dict), 'annotations must be a JSON object'
            for k, v in d.items():
                assert isinstance(k, str) and isinstance(v, str), f'annotation key/value must be strings: {k}={v}'
        except Exception as e:
            print(str(e), file=sys.stderr)
            sys.exit(1)
        " 2>/dev/null; then
          ERRORS+=("annotations is not a valid JSON object with string key-value pairs")
        fi

        # --- 6. Validate role-bindings JSON (non-empty array with required fields) ---
        echo "$LOG_PREFIX $(ts) Validating role-bindings JSON"
        if ! python3 -c "
        import json, sys
        FORBIDDEN_ROLES = ['cluster-admin', 'self-provisioner']
        try:
            bindings = json.loads('''$ROLE_BINDINGS''')
            assert isinstance(bindings, list) and len(bindings) > 0, 'role-bindings must be a non-empty JSON array'
            for i, b in enumerate(bindings):
                assert b.get('type') in ('user', 'group'), f'role-bindings[{i}].type must be user or group'
                assert b.get('name', '').strip(), f'role-bindings[{i}].name must be non-empty'
                assert b.get('role', '').strip(), f'role-bindings[{i}].role must be non-empty'
                if b['role'] in FORBIDDEN_ROLES:
                    print(f\"ERROR: role-bindings[{i}].role='{b['role']}' is forbidden (least privilege)\", file=sys.stderr)
                    sys.exit(1)
        except AssertionError as e:
            print(str(e), file=sys.stderr)
            sys.exit(1)
        except Exception as e:
            print(str(e), file=sys.stderr)
            sys.exit(1)
        " 2>/dev/null; then
          ERRORS+=("role-bindings validation failed: must be non-empty JSON array with type(user/group), name, role fields; cluster-admin and self-provisioner roles are forbidden")
        fi

        # --- 7. Validate resource-quota JSON ---
        echo "$LOG_PREFIX $(ts) Validating resource-quota JSON"
        if ! python3 -c "
        import json, sys
        VALID_KEYS = ['cpu', 'memory', 'storage', 'pods', 'services', 'configmaps', 'secrets',
                       'persistentvolumeclaims', 'limits.cpu', 'limits.memory',
                       'requests.cpu', 'requests.memory', 'requests.storage']
        try:
            q = json.loads('''$RESOURCE_QUOTA''')
            assert isinstance(q, dict) and len(q) > 0, 'resource-quota must be a non-empty JSON object'
            for k in q:
                assert isinstance(q[k], str) and q[k].strip(), f'resource-quota[\"{k}\"] must be a non-empty string'
        except Exception as e:
            print(str(e), file=sys.stderr)
            sys.exit(1)
        " 2>/dev/null; then
          ERRORS+=("resource-quota is not a valid JSON object or contains invalid values")
        fi

        # --- Report results ---
        if [ ${#ERRORS[@]} -gt 0 ]; then
          echo ""
          echo "$LOG_PREFIX $(ts) === VALIDATION FAILED ==="
          for err in "${ERRORS[@]}"; do
            echo "$LOG_PREFIX   ERROR: $err"
          done
          printf "failed" > "$(results.validation-status.path)"
          exit 1
        fi

        echo "$LOG_PREFIX $(ts) === All Inputs Validated Successfully ==="
        printf "passed" > "$(results.validation-status.path)"

---
# -----------------------------------------------------------------------------
# Task 2: check-namespace-existence
# Fails the pipeline if the namespace already exists.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-namespace-existence
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Checks if the target namespace already exists. Fails if it does.
  params:
    - name: project-name
      type: string
  results:
    - name: existence-status
      description: "not-found (safe to create) or exists (abort)"
  steps:
    - name: check
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[check-namespace]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        echo "$LOG_PREFIX $(ts) Checking if namespace '$PROJECT' already exists..."

        if oc get namespace "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts) ERROR: Namespace '$PROJECT' already exists. Aborting pipeline."
          printf "exists" > "$(results.existence-status.path)"
          exit 1
        fi

        echo "$LOG_PREFIX $(ts) Namespace '$PROJECT' does not exist. Safe to create."
        printf "not-found" > "$(results.existence-status.path)"

---
# -----------------------------------------------------------------------------
# Task 3: create-project-namespace
# Creates the OpenShift namespace with labels, annotations and requester info.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-project-namespace
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Creates the namespace, applies labels and annotations, and sets the
    openshift.io/requester annotation.
  params:
    - name: project-name
      type: string
    - name: labels
      type: string
    - name: annotations
      type: string
    - name: requester
      type: string
  results:
    - name: creation-status
      description: "created or failed"
  steps:
    - name: create-namespace
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[create-namespace]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        LABELS='$(params.labels)'
        ANNOTATIONS='$(params.annotations)'
        REQUESTER="$(params.requester)"

        echo "$LOG_PREFIX $(ts) Creating namespace '$PROJECT'..."

        # Create namespace via oc new-project (creates OpenShift Project resource)
        oc new-project "$PROJECT" --skip-config-write=true \
          --display-name="$PROJECT" \
          --description="Provisioned by Tekton Pipeline"

        echo "$LOG_PREFIX $(ts) Namespace '$PROJECT' created successfully."

        # --- Apply labels ---
        echo "$LOG_PREFIX $(ts) Applying labels..."
        LABEL_ARGS=$(python3 -c "
        import json
        labels = json.loads('''$LABELS''')
        for k, v in labels.items():
            print(f'{k}={v}')
        ")
        if [ -n "$LABEL_ARGS" ]; then
          while IFS= read -r label; do
            oc label namespace "$PROJECT" "$label" --overwrite
            echo "$LOG_PREFIX $(ts)   Label applied: $label"
          done <<< "$LABEL_ARGS"
        fi

        # --- Apply annotations ---
        echo "$LOG_PREFIX $(ts) Applying annotations..."
        ANNOTATION_ARGS=$(python3 -c "
        import json
        annotations = json.loads('''$ANNOTATIONS''')
        for k, v in annotations.items():
            print(f'{k}={v}')
        ")
        if [ -n "$ANNOTATION_ARGS" ]; then
          while IFS= read -r ann; do
            oc annotate namespace "$PROJECT" "$ann" --overwrite
            echo "$LOG_PREFIX $(ts)   Annotation applied: $ann"
          done <<< "$ANNOTATION_ARGS"
        fi

        # --- Set requester annotation ---
        echo "$LOG_PREFIX $(ts) Setting requester annotation: openshift.io/requester=$REQUESTER"
        oc annotate namespace "$PROJECT" "openshift.io/requester=$REQUESTER" --overwrite

        echo "$LOG_PREFIX $(ts) === Namespace '$PROJECT' fully configured ==="
        printf "created" > "$(results.creation-status.path)"

---
# -----------------------------------------------------------------------------
# Task 4: create-role-bindings
# Creates RoleBindings for each user/group entry. Enforces least privilege.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-role-bindings
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Creates RoleBindings from the role-bindings JSON array.
    Enforces least privilege by rejecting cluster-admin and similar roles.
  params:
    - name: project-name
      type: string
    - name: role-bindings
      type: string
    - name: requester
      type: string
  results:
    - name: binding-count
      description: "Number of RoleBindings created"
    - name: binding-status
      description: "created or failed"
  steps:
    - name: create-bindings
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[create-role-bindings]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        ROLE_BINDINGS='$(params.role-bindings)'
        REQUESTER="$(params.requester)"
        COUNT=0

        echo "$LOG_PREFIX $(ts) Creating role bindings in namespace '$PROJECT'..."

        # Parse and iterate over role-bindings JSON array
        BINDING_LINES=$(python3 -c "
        import json
        bindings = json.loads('''$ROLE_BINDINGS''')
        for b in bindings:
            print(f\"{b['type']}|{b['name']}|{b['role']}\")
        ")

        while IFS='|' read -r BTYPE BNAME BROLE; do
          [ -z "$BTYPE" ] && continue

          echo "$LOG_PREFIX $(ts) Processing: type=$BTYPE, name=$BNAME, role=$BROLE"

          if [ "$BTYPE" = "user" ]; then
            oc adm policy add-role-to-user "$BROLE" "$BNAME" -n "$PROJECT"
            echo "$LOG_PREFIX $(ts)   RoleBinding created: user/$BNAME -> $BROLE"
          elif [ "$BTYPE" = "group" ]; then
            oc adm policy add-role-to-group "$BROLE" "$BNAME" -n "$PROJECT"
            echo "$LOG_PREFIX $(ts)   RoleBinding created: group/$BNAME -> $BROLE"
          fi
          COUNT=$((COUNT + 1))
        done <<< "$BINDING_LINES"

        echo "$LOG_PREFIX $(ts) === $COUNT RoleBinding(s) created ==="
        printf "%d" "$COUNT" > "$(results.binding-count.path)"
        printf "created" > "$(results.binding-status.path)"

---
# -----------------------------------------------------------------------------
# Task 5: create-resource-quota
# Creates a ResourceQuota based on the provided JSON specification.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-resource-quota
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Creates a ResourceQuota in the target namespace using the provided
    resource-quota JSON object.
  params:
    - name: project-name
      type: string
    - name: resource-quota
      type: string
  results:
    - name: quota-status
      description: "created or failed"
  steps:
    - name: create-quota
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[create-resource-quota]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        RESOURCE_QUOTA='$(params.resource-quota)'

        echo "$LOG_PREFIX $(ts) Creating ResourceQuota in namespace '$PROJECT'..."

        # Build the hard limits YAML from JSON input
        HARD_SPEC=$(python3 -c "
        import json
        KEY_MAP = {
            'cpu': 'requests.cpu',
            'memory': 'requests.memory',
            'storage': 'requests.storage',
            'pods': 'pods',
            'services': 'services',
            'configmaps': 'configmaps',
            'secrets': 'secrets',
            'persistentvolumeclaims': 'persistentvolumeclaims',
            'limits.cpu': 'limits.cpu',
            'limits.memory': 'limits.memory',
            'requests.cpu': 'requests.cpu',
            'requests.memory': 'requests.memory',
            'requests.storage': 'requests.storage',
        }
        q = json.loads('''$RESOURCE_QUOTA''')
        for k, v in q.items():
            mapped = KEY_MAP.get(k, k)
            print(f'    {mapped}: \"{v}\"')
        ")

        cat <<EOF | oc apply -f -
        apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: project-quota
          namespace: ${PROJECT}
        spec:
          hard:
        ${HARD_SPEC}
        EOF

        echo "$LOG_PREFIX $(ts) ResourceQuota 'project-quota' created:"
        oc get resourcequota project-quota -n "$PROJECT" -o yaml | head -30
        echo "$LOG_PREFIX $(ts) === ResourceQuota created successfully ==="
        printf "created" > "$(results.quota-status.path)"

---
# -----------------------------------------------------------------------------
# Task 6: create-limit-range
# Creates a default LimitRange for container resource defaults.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-limit-range
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Creates a default LimitRange in the target namespace to enforce
    container-level CPU and memory defaults and maximums.
  params:
    - name: project-name
      type: string
    - name: default-cpu-limit
      type: string
      default: "500m"
    - name: default-cpu-request
      type: string
      default: "100m"
    - name: default-memory-limit
      type: string
      default: "512Mi"
    - name: default-memory-request
      type: string
      default: "128Mi"
    - name: max-cpu
      type: string
      default: "2"
    - name: max-memory
      type: string
      default: "4Gi"
  results:
    - name: limitrange-status
      description: "created or failed"
  steps:
    - name: create-limitrange
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[create-limit-range]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"

        echo "$LOG_PREFIX $(ts) Creating LimitRange in namespace '$PROJECT'..."

        cat <<EOF | oc apply -f -
        apiVersion: v1
        kind: LimitRange
        metadata:
          name: default-limits
          namespace: ${PROJECT}
        spec:
          limits:
            - type: Container
              default:
                cpu: "$(params.default-cpu-limit)"
                memory: "$(params.default-memory-limit)"
              defaultRequest:
                cpu: "$(params.default-cpu-request)"
                memory: "$(params.default-memory-request)"
              max:
                cpu: "$(params.max-cpu)"
                memory: "$(params.max-memory)"
        EOF

        echo "$LOG_PREFIX $(ts) LimitRange 'default-limits' created:"
        oc get limitrange default-limits -n "$PROJECT" -o yaml | head -25
        echo "$LOG_PREFIX $(ts) === LimitRange created successfully ==="
        printf "created" > "$(results.limitrange-status.path)"

---
# -----------------------------------------------------------------------------
# Task 7: create-network-policies
# Creates default-deny-ingress and allow-same-namespace NetworkPolicies.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-network-policies
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Creates two NetworkPolicies:
    1. default-deny-all-ingress — blocks all inbound traffic by default
    2. allow-same-namespace — permits pod-to-pod traffic within the namespace
  params:
    - name: project-name
      type: string
  results:
    - name: networkpolicy-status
      description: "created or failed"
  steps:
    - name: create-policies
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[create-network-policies]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"

        echo "$LOG_PREFIX $(ts) Creating default-deny-all-ingress NetworkPolicy..."

        cat <<EOF | oc apply -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: default-deny-all-ingress
          namespace: ${PROJECT}
        spec:
          podSelector: {}
          policyTypes:
            - Ingress
        EOF

        echo "$LOG_PREFIX $(ts) default-deny-all-ingress created."

        echo "$LOG_PREFIX $(ts) Creating allow-same-namespace NetworkPolicy..."

        cat <<EOF | oc apply -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-same-namespace
          namespace: ${PROJECT}
        spec:
          podSelector: {}
          policyTypes:
            - Ingress
          ingress:
            - from:
                - podSelector: {}
        EOF

        echo "$LOG_PREFIX $(ts) allow-same-namespace created."
        echo "$LOG_PREFIX $(ts) === NetworkPolicies created successfully ==="
        printf "created" > "$(results.networkpolicy-status.path)"

---
# -----------------------------------------------------------------------------
# Task 8: verify-project-resources
# Verifies all resources were created correctly. Produces JSON output.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-project-resources
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Final verification step. Checks namespace, labels, annotations,
    RoleBindings, ResourceQuota, LimitRange, and NetworkPolicies.
    Produces a JSON summary report.
  params:
    - name: project-name
      type: string
    - name: requester
      type: string
    - name: labels
      type: string
    - name: annotations
      type: string
  results:
    - name: verification-result
      description: "JSON output with project status and created resources"
    - name: verification-status
      description: "passed or failed"
  steps:
    - name: verify
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        LOG_PREFIX="[verify-resources]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        REQUESTER="$(params.requester)"
        ALL_OK=true
        ERRORS=""
        CREATED_RESOURCES="[]"

        echo "$LOG_PREFIX $(ts) === Starting Final Verification ==="

        # --- 1. Namespace exists ---
        echo "$LOG_PREFIX $(ts) [1/6] Checking namespace..."
        if oc get namespace "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts)   PASS: Namespace '$PROJECT' exists"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: Namespace '$PROJECT' not found"
          ALL_OK=false
          ERRORS="$ERRORS namespace_not_found;"
        fi

        # --- 2. Labels ---
        echo "$LOG_PREFIX $(ts) [2/6] Checking labels..."
        EXPECTED_LABELS='$(params.labels)'
        LABEL_CHECK=$(python3 -c "
        import json, subprocess, sys
        expected = json.loads('''$EXPECTED_LABELS''')
        result = subprocess.run(['oc', 'get', 'namespace', '$PROJECT', '-o', 'jsonpath={.metadata.labels}'],
                                capture_output=True, text=True)
        actual = json.loads(result.stdout) if result.stdout else {}
        missing = []
        for k, v in expected.items():
            if actual.get(k) != v:
                missing.append(f'{k}={v}')
        if missing:
            print('FAIL:' + ','.join(missing))
            sys.exit(1)
        print('PASS')
        " 2>/dev/null) || true
        if [[ "$LABEL_CHECK" == PASS ]]; then
          echo "$LOG_PREFIX $(ts)   PASS: All labels verified"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: Missing/incorrect labels: $LABEL_CHECK"
          ALL_OK=false
          ERRORS="$ERRORS labels_mismatch;"
        fi

        # --- 3. Annotations ---
        echo "$LOG_PREFIX $(ts) [3/6] Checking annotations..."
        REQ_ANN=$(oc get namespace "$PROJECT" -o jsonpath='{.metadata.annotations.openshift\.io/requester}' 2>/dev/null || echo "")
        if [ "$REQ_ANN" = "$REQUESTER" ]; then
          echo "$LOG_PREFIX $(ts)   PASS: Requester annotation correct ($REQ_ANN)"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: Requester annotation expected='$REQUESTER' actual='$REQ_ANN'"
          ALL_OK=false
          ERRORS="$ERRORS requester_annotation_mismatch;"
        fi

        # --- 4. RoleBindings ---
        echo "$LOG_PREFIX $(ts) [4/6] Checking RoleBindings..."
        RB_COUNT=$(oc get rolebindings -n "$PROJECT" --no-headers 2>/dev/null | wc -l | tr -d ' ')
        if [ "$RB_COUNT" -gt 0 ]; then
          echo "$LOG_PREFIX $(ts)   PASS: $RB_COUNT RoleBinding(s) found"
          oc get rolebindings -n "$PROJECT" --no-headers 2>/dev/null | while read -r line; do
            echo "$LOG_PREFIX $(ts)     - $line"
          done
        else
          echo "$LOG_PREFIX $(ts)   FAIL: No RoleBindings found"
          ALL_OK=false
          ERRORS="$ERRORS no_rolebindings;"
        fi

        # --- 5. ResourceQuota & LimitRange ---
        echo "$LOG_PREFIX $(ts) [5/6] Checking ResourceQuota and LimitRange..."
        if oc get resourcequota project-quota -n "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts)   PASS: ResourceQuota 'project-quota' found"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: ResourceQuota 'project-quota' not found"
          ALL_OK=false
          ERRORS="$ERRORS resourcequota_missing;"
        fi
        if oc get limitrange default-limits -n "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts)   PASS: LimitRange 'default-limits' found"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: LimitRange 'default-limits' not found"
          ALL_OK=false
          ERRORS="$ERRORS limitrange_missing;"
        fi

        # --- 6. NetworkPolicies ---
        echo "$LOG_PREFIX $(ts) [6/6] Checking NetworkPolicies..."
        NP_OK=true
        if oc get networkpolicy default-deny-all-ingress -n "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts)   PASS: NetworkPolicy 'default-deny-all-ingress' found"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: NetworkPolicy 'default-deny-all-ingress' not found"
          NP_OK=false
          ALL_OK=false
          ERRORS="$ERRORS deny_ingress_policy_missing;"
        fi
        if oc get networkpolicy allow-same-namespace -n "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts)   PASS: NetworkPolicy 'allow-same-namespace' found"
        else
          echo "$LOG_PREFIX $(ts)   FAIL: NetworkPolicy 'allow-same-namespace' not found"
          NP_OK=false
          ALL_OK=false
          ERRORS="$ERRORS allow_same_ns_policy_missing;"
        fi

        # --- Build resource list ---
        CREATED_RESOURCES=$(python3 -c "
        import json, subprocess
        resources = []
        ns = '$PROJECT'
        checks = [
            ('Namespace', '', 'oc get namespace $PROJECT -o name'),
            ('ResourceQuota', 'project-quota', 'oc get resourcequota project-quota -n $PROJECT -o name'),
            ('LimitRange', 'default-limits', 'oc get limitrange default-limits -n $PROJECT -o name'),
            ('NetworkPolicy', 'default-deny-all-ingress', 'oc get networkpolicy default-deny-all-ingress -n $PROJECT -o name'),
            ('NetworkPolicy', 'allow-same-namespace', 'oc get networkpolicy allow-same-namespace -n $PROJECT -o name'),
        ]
        for kind, name, cmd in checks:
            r = subprocess.run(cmd, shell=True, capture_output=True, text=True)
            if r.returncode == 0:
                resources.append({'kind': kind, 'name': name or ns})
        rb = subprocess.run(f'oc get rolebindings -n {ns} -o jsonpath={{.items[*].metadata.name}}',
                            shell=True, capture_output=True, text=True)
        if rb.returncode == 0 and rb.stdout.strip():
            for name in rb.stdout.strip().split():
                resources.append({'kind': 'RoleBinding', 'name': name})
        print(json.dumps(resources))
        ")

        # --- Build JSON output ---
        if [ "$ALL_OK" = true ]; then
          STATUS="success"
          echo "$LOG_PREFIX $(ts) === VERIFICATION PASSED ==="
        else
          STATUS="fail"
          echo "$LOG_PREFIX $(ts) === VERIFICATION FAILED ==="
        fi

        JSON_OUTPUT=$(python3 -c "
        import json
        output = {
            'project_name': '$PROJECT',
            'status': '$STATUS',
            'requester': '$REQUESTER',
            'created_resources': json.loads('''$CREATED_RESOURCES'''),
            'errors': [e for e in '$ERRORS'.split(';') if e.strip()]
        }
        print(json.dumps(output, indent=2))
        ")

        echo ""
        echo "$LOG_PREFIX $(ts) === Pipeline Output ==="
        echo "$JSON_OUTPUT"

        printf '%s' "$JSON_OUTPUT" > "$(results.verification-result.path)"

        if [ "$ALL_OK" = true ]; then
          printf "passed" > "$(results.verification-status.path)"
        else
          printf "failed" > "$(results.verification-status.path)"
          exit 1
        fi

---
# -----------------------------------------------------------------------------
# Task 9: rollback-project
# Deletes the namespace and all resources within it on pipeline failure.
# Used as a finally task.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rollback-project
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Rollback task that runs on pipeline failure. Deletes the namespace
    (which cascades and removes all resources within it).
  params:
    - name: project-name
      type: string
    - name: requester
      type: string
  results:
    - name: rollback-status
      description: "rolled-back, not-needed, or failed"
  steps:
    - name: rollback
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        LOG_PREFIX="[rollback]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        REQUESTER="$(params.requester)"

        echo "$LOG_PREFIX $(ts) === Rollback Triggered ==="
        echo "$LOG_PREFIX $(ts) Pipeline failed. Initiating cleanup for namespace '$PROJECT'..."
        echo "$LOG_PREFIX $(ts) Requester: $REQUESTER"

        # Check if namespace exists before attempting deletion
        if ! oc get namespace "$PROJECT" &>/dev/null; then
          echo "$LOG_PREFIX $(ts) Namespace '$PROJECT' does not exist. No rollback needed."
          printf "not-needed" > "$(results.rollback-status.path)"
          exit 0
        fi

        echo "$LOG_PREFIX $(ts) Namespace '$PROJECT' found. Deleting..."

        # Delete the namespace (cascades to all resources within it)
        RETRY_COUNT=0
        MAX_RETRIES=3
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if oc delete namespace "$PROJECT" --wait=true --timeout=60s 2>/dev/null; then
            echo "$LOG_PREFIX $(ts) Namespace '$PROJECT' deleted successfully."
            printf "rolled-back" > "$(results.rollback-status.path)"
            exit 0
          fi
          RETRY_COUNT=$((RETRY_COUNT + 1))
          echo "$LOG_PREFIX $(ts) Delete attempt $RETRY_COUNT/$MAX_RETRIES failed. Retrying in 5s..."
          sleep 5
        done

        echo "$LOG_PREFIX $(ts) ERROR: Failed to delete namespace '$PROJECT' after $MAX_RETRIES attempts."
        echo "$LOG_PREFIX $(ts) Manual intervention required."
        printf "failed" > "$(results.rollback-status.path)"
        exit 1

---
# -----------------------------------------------------------------------------
# Task 10: generate-pipeline-output
# Always runs (finally task). Produces the final JSON report.
# -----------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-pipeline-output
  labels:
    app.kubernetes.io/part-of: project-provisioning
spec:
  description: >
    Finally task that always runs. Generates the final JSON report
    with the pipeline execution status.
  params:
    - name: project-name
      type: string
    - name: requester
      type: string
    - name: pipeline-status
      type: string
      description: "Aggregate status of pipeline tasks"
  results:
    - name: pipeline-output
      description: "Final JSON output of the pipeline execution"
  steps:
    - name: generate-output
      image: quay.io/openshift/origin-cli:4.19
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        LOG_PREFIX="[pipeline-output]"
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

        PROJECT="$(params.project-name)"
        REQUESTER="$(params.requester)"
        PIPELINE_STATUS="$(params.pipeline-status)"

        echo "$LOG_PREFIX $(ts) === Generating Final Pipeline Report ==="

        # Determine overall status
        if [ "$PIPELINE_STATUS" = "Succeeded" ]; then
          STATUS="success"
        else
          STATUS="fail"
        fi

        # Collect created resources (if namespace exists)
        CREATED_RESOURCES="[]"
        ERRORS="[]"
        if oc get namespace "$PROJECT" &>/dev/null; then
          CREATED_RESOURCES=$(python3 -c "
        import json, subprocess
        resources = []
        ns = '$PROJECT'
        resources.append({'kind': 'Namespace', 'name': ns})
        for kind, cmd in [
            ('ResourceQuota', f'oc get resourcequota -n {ns} -o jsonpath={{.items[*].metadata.name}}'),
            ('LimitRange', f'oc get limitrange -n {ns} -o jsonpath={{.items[*].metadata.name}}'),
            ('NetworkPolicy', f'oc get networkpolicy -n {ns} -o jsonpath={{.items[*].metadata.name}}'),
            ('RoleBinding', f'oc get rolebindings -n {ns} -o jsonpath={{.items[*].metadata.name}}'),
        ]:
            r = subprocess.run(cmd, shell=True, capture_output=True, text=True)
            if r.returncode == 0 and r.stdout.strip():
                for name in r.stdout.strip().split():
                    resources.append({'kind': kind, 'name': name})
        print(json.dumps(resources))
        " 2>/dev/null) || CREATED_RESOURCES="[]"
        fi

        # Build final JSON
        JSON_OUTPUT=$(python3 -c "
        import json, datetime
        output = {
            'project_name': '$PROJECT',
            'status': '$STATUS',
            'requester': '$REQUESTER',
            'timestamp': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
            'created_resources': json.loads('''$CREATED_RESOURCES'''),
            'errors': [] if '$STATUS' == 'success' else ['Pipeline did not complete successfully. Check task logs for details.']
        }
        print(json.dumps(output, indent=2))
        ")

        echo ""
        echo "================================================================="
        echo "  PIPELINE EXECUTION REPORT"
        echo "================================================================="
        echo "$JSON_OUTPUT"
        echo "================================================================="

        printf '%s' "$JSON_OUTPUT" > "$(results.pipeline-output.path)"
