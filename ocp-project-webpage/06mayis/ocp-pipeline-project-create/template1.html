<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple UI</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #EDE3D3;
            color: #2B1E1B;
            padding: 40px;
        }

        /* card */
        .card {
            max-width: 500px;
            margin: auto;
            background: #FFF8EF;
            border: 3px solid #3A2E2A;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 4px 4px 0 #3A2E2A;
        }

        /* labels */
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
        }

        /* inputs */
        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 3px solid #3A2E2A;
            border-radius: 10px;
            font-size: 14px;
            background: white;
        }

        /* list */
        .list {
            margin-top: 10px;
            border: 3px solid #3A2E2A;
            border-radius: 10px;
            background: white;
        }

        .list-item {
            padding: 10px;
            border-bottom: 2px solid #eee;
            cursor: pointer;
        }

        .list-item:hover {
            background: #F4E7D0;
        }

        .list-item.selected {
            background: #F4D06F;
        }

        /* button */
        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            border: 3px solid #3A2E2A;
            border-radius: 12px;
            background: #8EC7A6;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 4px 4px 0 #3A2E2A;
        }

        button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="card">

        <h2>Simple Form</h2>

        <!-- TEXTBOX -->
        <label>Project Name</label>
        <input type="text" placeholder="my-project">

        <!-- DROPDOWN -->
        <label>Role</label>
        <select>
            <option>Select role...</option>
            <option>Admin</option>
            <option>Developer</option>
            <option>Viewer</option>
        </select>

        <!-- LIST BOX -->
        <label>Select User</label>
        <div class="list" id="userList">
            <div class="list-item">admin</div>
            <div class="list-item">developer</div>
            <div class="list-item">john doe</div>
            <div class="list-item">jane smith</div>
        </div>

        <!-- BUTTON -->
        <button>Create</button>

    </div>

    <script>
        // basit seçim
        document.querySelectorAll(".list-item").forEach(item => {
            item.onclick = () => {
                document.querySelectorAll(".list-item").forEach(i => i.classList.remove("selected"));
                item.classList.add("selected");
            };
        });
    </script>

</body>

</html>
